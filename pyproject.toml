[project]
name = "colorgrader"
version = "0.1.0"
description = "Local color grading assistant: analyzes footage and a reference, builds a colorist-style grade, exports a DaVinci Resolve recipe, LUTs and graded clips."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "colour-science>=0.4.4",
    "opencv-python-headless>=4.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
colorgrader = "colorgrader.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["colorgrader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
